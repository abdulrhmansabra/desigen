<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070914">
  <title>AI Shorts — فيديو الذكاء الاصطناعي</title>
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <div class="statusbar" dir="ltr"><span>9:41</span><span class="status-right">▮▮▮　◉　▰ 100%</span></div>
  <header class="topbar">
    <button class="credits"><span class="sparkle">✦</span><b>0</b><span>›</span></button>
    <button class="page-title"><span>⌄</span><strong>فيديو الذكاء الاصطناعي</strong></button>
    <button class="round" aria-label="التالي">›</button>
  </header>

  <section class="pro-banner">
    <div class="orb"></div>
    <span class="crown">♛</span>
    <div class="pro-copy"><h2>جرب AiShorts Pro الآن</h2><p>وصول غير محدود إلى جميع الميزات</p></div>
    <button class="upgrade">ترقية الآن <b>›</b></button>
  </section>

  <nav class="tabs" aria-label="أنواع الفيديو">
    <button class="tab active"><span>✦</span> جميع الفيديو</button>
    <button class="tab"><span>▧</span> من صورة إلى فيديو</button>
    <button class="tab"><span>▤</span> من نص إلى فيديو</button>
  </nav>

  <section class="model-card">
    <img src="assets/feature-art.svg" alt="" class="model-art">
    <div class="model-copy"><div class="model-title"><h2>Minimax H3</h2><span>الأحدث</span></div><p>إدخال متعدد الوسائط وصوت أصلي لإنشاء فيديو بدقة 2K.</p></div>
    <b class="arrow">‹</b>
  </section>

  <section class="references">
    <div class="section-title"><span class="info">i</span><h2>الصورة / الفيديو المرجعي (اختياري)</h2></div>
    <div class="reference-grid">
      <button class="reference-card advanced">
        <span class="tag">متقدم</span><span class="media-icon">▧</span><h3>إضافة 3</h3>
        <span class="thumbs"><i class="thumb t1"></i><i class="thumb t2"></i><i class="thumb t3"></i><b>＋</b></span><small>مناسب للمشاريع المعقدة</small>
      </button>
      <button class="reference-card premium">
        <span class="tag">مميز</span><span class="media-icon">▧</span><h3>إضافة 2</h3>
        <span class="thumbs"><i class="thumb t2"></i><i class="thumb t3"></i><b>＋</b></span><small>لنتائج أفضل مع التعديل</small>
      </button>
      <button class="reference-card selected required">
        <span class="tag">* مطلوب</span><span class="media-icon cyan">▧＋</span><h3>إضافة 1</h3>
        <span class="thumbs"><i class="thumb t1"></i><i class="thumb t3"></i><b>＋</b></span><small>ابدأ بصورة واحدة أو فيديو مختصر</small>
      </button>
    </div>
    <div class="hint"><span>✣</span> يدعم ما يصل إلى 3 فيديوهات مرجعية. الحد الأقصى لإجمالي المدة 30 ثانية.</div>
  </section>

  <section class="prompt-panel">
    <h2>المطالبة <span>✦</span></h2>
    <div class="prompt-box">
      <textarea id="prompt" maxlength="5000" placeholder="قم بتحميل صورة/فيديو مرجعي، وأدخل نصاً، أوصف الفيديو الذي تريد إنشاءه..."></textarea>
      <div class="prompt-tools"><button id="auto">◎ توليد تلقائي</button><span><b id="count">0</b>/5000　✎</span></div>
    </div>
    <div class="settings">
      <button class="setting"><span class="setting-icon">▯</span><span>نسبة العرض<br><b>9:16</b></span><span>›</span></button>
      <button class="setting"><span class="setting-icon">⚒</span><span>الأسلوب<br><b>واقعي</b></span><span>›</span></button>
      <button class="setting"><span class="setting-icon">⚙</span><span>الإعدادات المتقدمة</span><span>›</span></button>
    </div>
    <button class="create"><span>✦</span> إنشاء <b>›</b></button>
  </section>
  <footer class="system-nav" dir="ltr"><span>ⅡⅠⅠ</span><i></i><span class="back">›</span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
