name: Extract PixVerse Component Library

on:
  push:
    paths:
      - 'PixVerse_Deep_Component_Library.zip'
      - '.github/workflows/extract-pixverse-library.yml'

permissions:
  contents: write

jobs:
  extract-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract library files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("PixVerse_Deep_Component_Library.zip")
          with ZipFile(archive) as z:
              for item in z.infolist():
                  target = (Path(".") / item.filename).resolve()
                  if not target.is_relative_to(Path(".").resolve()):
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
              z.extractall(".")

          Path("README.md").write_text("""# PixVerse-Inspired UI Component Library

The component library has been extracted into this repository.

- **Interactive Arabic RTL catalogue:** [index.html](index.html)
- **Arabic guide:** [README_AR.md](README_AR.md)
- **CSS design tokens:** [css/tokens.css](css/tokens.css)
- **Reusable component styles:** [css/components.css](css/components.css)
- **Design tokens JSON:** [tokens/design-tokens.json](tokens/design-tokens.json)
- **Android migration guide:** [docs/ANDROID_MAPPING_AR.md](docs/ANDROID_MAPPING_AR.md)
- **Component inventory:** [docs/COMPONENT_INVENTORY_AR.md](docs/COMPONENT_INVENTORY_AR.md)
- **Research notes:** [docs/RESEARCH_NOTES_AR.md](docs/RESEARCH_NOTES_AR.md)

This is an independent, PixVerse-inspired reference library, not an official PixVerse package.
Open `index.html` in a browser to browse the catalogue.
""", encoding="utf-8")
          PY
      - name: Commit extracted library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_AR.md index.html docs android-reference css tokens js
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract PixVerse component library into repository"
            git push
          fi
